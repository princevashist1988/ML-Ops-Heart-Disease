# Prometheus config for docker compose (static target).
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local-compose

rule_files:
  - alert_rules.yml   # resolved relative to this file

scrape_configs:
  - job_name: heart-risk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: heart-risk-api

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heart-risk-api.fullname" . }}
  labels:
    {{- include "heart-risk-api.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.decisionThreshold }}
  DECISION_THRESHOLD: {{ .Values.config.decisionThreshold | quote }}
  {{- end }}
